<script>
  let analyticsData = {
    actionId: "",
    project:
      '{{ strings.Trim (strings.Replace (replaceRE `^https?://[^/]+` "" .Site.BaseURL) "/" " ") "/ " }}',
    siteTitle: "{{ .Site.Title }}",
    pageTitle:
      '{{ $pageTitle := ""}} {{ with .Page.Title }} {{ $pageTitle = . }} {{ else }} {{ $pageTitle = .Page.Params.tec_title }} {{ end }}{{ $pageTitle }}'
        .trim()
        .replace(/"/g, ""),
    url: window.location.href,
  };
  function logAnalytics() {
    analyticsData.action =
      document.visibilityState == "visible" ? "enter" : "leave";
    if (analyticsData.action == "enter") {
      analyticsData.actionId = `${Math.random()}`;
    }
    navigator.sendBeacon("/analytics", JSON.stringify(analyticsData));
  }
  function logOut() {
    analyticsData.action = "leave";
    navigator.sendBeacon("/analytics", JSON.stringify(analyticsData));
    document.removeEventListener("visibilitychange", logAnalytics);
    window.location = "/logout";
  }
  document.removeEventListener("visibilitychange", logAnalytics);
  document.addEventListener("visibilitychange", logAnalytics);
  window.onload = () => {
    // log page view
    logAnalytics();
    // update time local timezone display
    let updated = document.getElementById("last-updated-time-utc");
    if (updated) {
      updated.textContent = new Intl.DateTimeFormat(navigator.language, {
        dateStyle: "full",
        timeStyle: "long",
      }).format(new Date(updated.textContent));
    }
  };
</script>

{{ if templates.Exists "partials/google_analytics_tag.html" }} {{ partial
"google_analytics_tag.html" . }} {{ end }} {{ $menus := .Site.Menus.shortcuts }}
<script>
  // Pass menu data to JavaScript

  document.addEventListener('DOMContentLoaded', function() {
    const pattern = /\s*<[^>]+>\s*/g
    const menuData = {{ $menus | jsonify | safeJS }} || [];
    let downloads = []
      for (let item of menuData) {
        if (item?.Params?.download === true) {
        downloads.push({url: item.URL, text: item.Name.replace(pattern, '')})
        }
      }
    if (downloads.length == 0) {
      return
    }
    // Find all shortcut menu links
    const menuItems = document.querySelectorAll('#R-shortcutmenu-shortcuts a');
    menuItems.forEach((link, index) => {
       const text = link.innerHTML.replace(pattern, '')
       const href = link.getAttribute('href');
       // Find the matching menu item by both URL and Name
       const matchingMenuItem = downloads.find(download => {
         return href.endsWith(download.url) && text === download.text;
       });

      // Only add download attribute if this specific menu item has download: true
      if (matchingMenuItem) {
        link.setAttribute('download', '');
      }
    });
  });
</script>
