# Build and deploy the Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.147.2
      HUGO_ENVIRONMENT: production
      TZ: America/Los_Angeles
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Cache Restore
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/hugo_cache
          key: hugo-${{ github.run_id }}
          restore-keys:
            hugo-
      - name: Configure Git
        run: git config core.quotepath false
      - name: Set HUGO_ASSET_PREFIX from repo name
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: echo "HUGO_ASSET_PREFIX=/$REPO_NAME" >> $GITHUB_ENV
      - name: Build with Hugo
        run: |
          hugo \
            --gc \
            --minify \
            --environment github \
            --config config.toml,config.github.toml \
            --cacheDir "${{ runner.temp }}/hugo_cache"
      - name: Debug- Print baseURL and config summary
        run: |
          echo "Base URL:"
          grep '^baseURL' config*.toml || echo "Not found"
          echo "Public folder structure:"
          tree -L 3 ./public || find ./public -maxdepth 3
      - name: Debug- Check for asset path issues
        run: |
          echo "Looking for JS/CSS references in index.html:"
          grep -Eo 'src="[^"]+"|href="[^"]+"' ./public/index.html | sort || echo "No matches found or file missing."
      - name: Debug- Look for duplicated subpaths
        run: |
          echo "Looking for duplicate subpaths in public HTML files..."
          grep -r "fortisoar-tips-and-tricks/fortisoar-tips-and-tricks" ./public || echo "No duplicated subpaths found"

      - name: Build offline zip (file:// compatible)
        run: |
          hugo \
            --gc \
            --minify \
            --config config.toml,config.offline.toml \
            --cacheDir "${{ runner.temp }}/hugo_cache" \
            -d ./public-offline
          cd ./public-offline
          zip -r ../fortisoar-tips-and-tricks-offline.zip .
      - name: Publish offline zip to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete offline-latest --yes 2>/dev/null || true
          gh release create offline-latest fortisoar-tips-and-tricks-offline.zip \
            --title "Offline Workshop (latest)" \
            --notes "Auto-updated on every push to main. Extract and open index.html locally via file://." \
            --latest=false

      - name: Cache Save
        id: cache-save
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/hugo_cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
